<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ghost Subscription Shield</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080f;--p1:#11132a;--p2:#1b1e3d;--tx:#eef0ff;--mu:#8e93b8;--vi:#8b5cf6;--cy:#22d3ee;--pk:#f472b6;--gr:#34d399;--am:#fbbf24;--rd:#fb7185;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg) radial-gradient(60% 45% at 8% 0,#4c1d9566,transparent) no-repeat;color:var(--tx);font:15px/1.5 Sora,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.02em}button,input,select{font:inherit;color:inherit}
.card{background:linear-gradient(160deg,var(--p2),var(--p1));border:1px solid #ffffff16;border-radius:18px;padding:18px}
.b,.g,.d{border:0;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;transition:transform .15s,filter .15s}
.b{background:linear-gradient(90deg,var(--vi),var(--pk));color:#fff}.g{background:#ffffff12;border:1px solid #ffffff1c}.d{background:linear-gradient(90deg,#e11d48,#fb7185);color:#fff}
.b:hover,.d:hover{filter:brightness(1.12)}.g:hover{background:#ffffff1e}button:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
input,select{width:100%;background:#0b0d1e;border:1px solid #ffffff22;border-radius:12px;padding:11px 13px;margin:6px 0 12px}input:focus,select:focus{border-color:var(--vi);outline:0}
label{font-size:13px;color:var(--mu)}.err{color:var(--rd);min-height:20px;font-size:13px}.mu{color:var(--mu)}
.auth{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;max-width:1080px;margin:0 auto;padding:6vh 20px;align-items:center}
.hero h1{font-size:clamp(34px,5vw,56px);line-height:1.05;background:linear-gradient(90deg,#fff,#c4b5fd 50%,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);font-size:17px;max-width:46ch}.orb{width:84px;height:84px;border-radius:26px;margin-bottom:22px;display:grid;place-items:center;font-size:40px;background:conic-gradient(from 0deg,var(--vi),var(--cy),var(--pk),var(--vi));animation:sp 9s linear infinite;box-shadow:0 0 60px #8b5cf688}.orb span{animation:sp 9s linear infinite reverse}@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.chip{padding:6px 12px;border-radius:99px;background:#ffffff0f;border:1px solid #ffffff1a;font-size:13px}
.tabs{display:flex;gap:6px;background:#0b0d1e;padding:5px;border-radius:14px;margin-bottom:16px}.tabs button{flex:1;border:0;background:0;padding:9px;border-radius:10px;cursor:pointer;color:var(--mu);font-weight:600}.tabs .on{background:var(--p2);color:#fff}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:14px;padding:12px 20px;background:#07080fe6;backdrop-filter:blur(12px);border-bottom:1px solid #ffffff12}
.logo{font-weight:800;white-space:nowrap}nav{display:flex;gap:4px;overflow-x:auto;flex:1}nav button{border:0;background:0;color:var(--mu);padding:8px 13px;border-radius:10px;cursor:pointer;white-space:nowrap;font-weight:600}nav .on{background:#ffffff14;color:#fff}
main{max-width:1100px;margin:0 auto;padding:22px 20px 80px}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:1.3fr 1fr}
.stat b{display:block;font-size:28px;margin-top:4px}.stat.v{border-color:#8b5cf666}.stat.r b{color:var(--rd)}.stat.c b{color:var(--cy)}.stat.p b{color:var(--pk)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.sp{flex:1}.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.t-active{background:#34d39922;color:var(--gr)}.t-risk{background:#fbbf2422;color:var(--am)}.t-zombie{background:#fb718533;color:var(--rd)}.t-cancelled{background:#ffffff14;color:var(--mu)}
.bar{height:7px;border-radius:9px;background:#ffffff14;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.sub{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center}.av{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--vi),var(--cy))}
.sub .cap{width:110px;margin:0;padding:6px 9px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;grid-column:2/4}
.tb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tb input,.tb select{margin:0;width:auto;flex:1;min-width:140px}
#ov{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:20;padding:16px}#ov.on{display:grid}#ov .card{width:min(440px,100%);animation:pop .18s}@keyframes pop{from{transform:scale(.94);opacity:0}}
#ts{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:30;display:grid;gap:8px;width:min(420px,92vw)}.toast{background:#1b1e3df5;border:1px solid #ffffff22;border-left:4px solid var(--vi);border-radius:12px;padding:12px 14px}.toast.bad{border-left-color:var(--rd)}.toast.good{border-left-color:var(--gr)}
.chat{max-height:46vh;overflow:auto;display:grid;gap:10px;margin-bottom:12px}.m{padding:10px 14px;border-radius:14px;max-width:88%;white-space:pre-wrap}.m.u{background:linear-gradient(90deg,var(--vi),var(--pk));justify-self:end}.m.a{background:#ffffff10}
.log{display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff10}.dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.lg{display:grid;gap:6px;font-size:13px}.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
@media(max-width:760px){.auth,.g2{grid-template-columns:1fr}.logo{display:none}.sub .cap{width:90px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="ov"></div><div id="ts" aria-live="polite"></div>
<script>
"use strict";
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mem={},st={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}};
const ld=k=>{try{return JSON.parse(st.get(k))}catch(e){return null}},sv=(k,v)=>st.set(k,JSON.stringify(v));
const rl={};function ok(k,max,ms){const n=Date.now();rl[k]=(rl[k]||[]).filter(t=>n-t<ms);if(rl[k].length>=max)return false;rl[k].push(n);return true}
const DAY=864e5,inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");let U=null,D=null,view="dash",mode="in",seen=0;
function toast(t,c){const e=document.createElement("div");e.className="toast "+(c||"");e.textContent=t;$("#ts").append(e);setTimeout(()=>e.remove(),4200)}
async function hash(pw,salt){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);const b=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:new TextEncoder().encode(salt),iterations:100000},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const SEED=[["Netflix Premium","Entertainment",649,45,"https://www.netflix.com/cancelplan"],["Spotify Premium","Music",119,2,"https://www.spotify.com/account/subscription/"],["Adobe Creative Cloud","Software",1675,38,"https://account.adobe.com/plans"],["Amazon Prime","Shopping",299,5,"https://www.amazon.in/mc"],["Disney+ Hotstar","Entertainment",299,20,"https://www.hotstar.com/in/subscribe"],["Notion Plus","Software",800,9,"https://www.notion.so/my-account"],["Gym Pass","Health",999,41,""]];
const FEED=[["YouTube Premium",129,3],["Zomato Gold",149,3],["iCloud 50GB",75,3],["Netflix Premium",649,3],["Swiggy",340,1],["Uber",210,1],["Spotify Premium",119,3]];
const COL={Entertainment:"#8b5cf6",Music:"#22d3ee",Software:"#f472b6",Shopping:"#fbbf24",Health:"#34d399",Other:"#94a3b8"};
let sid=0;const mk=(n,c,a,d,u)=>({id:Date.now()+"-"+sid++,name:n,cat:c,amt:a,cap:a,last:Date.now()-d*DAY,url:u,status:"active"});
const idle=s=>Math.floor((Date.now()-s.last)/DAY);
function risk(s){if(s.status!=="active")return 0;const i=idle(s);let r=Math.round(Math.min(65,i/30*65)+Math.min(20,s.amt/100)+(s.amt>s.cap?15:0));return i>30?Math.max(r,88):Math.min(r,99)}
const state=s=>s.status!=="active"?"cancelled":idle(s)>30?"zombie":risk(s)>=40?"risk":"active";
const lab={active:"Active",risk:"At risk",zombie:"Zombie",cancelled:"Cancelled"},rc=r=>r>=75?"var(--rd)":r>=40?"var(--am)":"var(--gr)";
const live=()=>D.subs.filter(s=>s.status==="active"),mo=()=>live().reduce((a,s)=>a+s.amt,0);
function log(t,k){D.log.unshift({t,k,at:Date.now()});D.log=D.log.slice(0,80);sv("gss_d_"+U,D)}
function touch(){sessionStorage.setItem("gss_s",JSON.stringify({u:U,t:Date.now()}))}
function boot(){let s=null;try{s=JSON.parse(sessionStorage.getItem("gss_s"))}catch(e){}if(s&&Date.now()-s.t<9e5){enter(s.u)}else render()}
function enter(u){U=u;D=ld("gss_d_"+u);if(!D){D={subs:SEED.map(x=>mk(...x)),log:[]};log("Account created with demo subscriptions","info")}touch();render()}
async function auth(){const em=$("#em").value.trim().toLowerCase(),pw=$("#pw").value,e=$("#er");e.textContent="";
if(!/^[^\s@]{1,64}@[^\s@]{1,190}\.[^\s@]{2,}$/.test(em)){e.textContent="Enter a valid email address.";return}
if(!ok("auth",6,6e4)){e.textContent="Too many attempts. Wait a minute and try again.";return}
const users=ld("gss_u")||{},f=ld("gss_f_"+em)||{n:0,until:0};
if(Date.now()<f.until){e.textContent="Account locked for "+Math.ceil((f.until-Date.now())/1e3)+"s after repeated failures.";return}
if(mode==="up"){if(users[em]){e.textContent="This email already has an account. Log in instead.";return}
if(pw.length<8||!/[A-Za-z]/.test(pw)||!/\d/.test(pw)){e.textContent="Use 8+ characters with letters and numbers.";return}
if(pw!==$("#pw2").value){e.textContent="Passwords do not match.";return}
const salt=crypto.getRandomValues(new Uint32Array(4)).join("-");users[em]={salt,h:await hash(pw,salt)};sv("gss_u",users);toast("Account created. Welcome to the Shield.","good");enter(em);return}
const u=users[em];if(u&&await hash(pw,u.salt)===u.h){sv("gss_f_"+em,{n:0,until:0});enter(em);return}
f.n++;if(f.n>=5)f.until=Date.now()+3e4*2**(f.n-5);sv("gss_f_"+em,f);e.textContent="Email or password is incorrect."+(f.n>=5?" Locked temporarily.":"")}
function logout(){U=D=null;sessionStorage.removeItem("gss_s");view="dash";render()}
function modal(h){const o=$("#ov");o.innerHTML='<div class="card" role="dialog" aria-modal="true">'+h+"</div>";o.classList.add("on")}
const closeM=()=>$("#ov").classList.remove("on");
function render(){const a=$("#app");if(!U){a.innerHTML=`<div class="auth"><section class="hero"><div class="orb"><span>🛡</span></div><h1>Ghost Subscription Shield</h1><p>Stop paying for subscriptions you forgot. Cap every charge, catch zombies early and cancel in one tap.</p><div class="chips"><span class="chip">Spending caps</span><span class="chip">Zombie detection</span><span class="chip">Kill Switch</span><span class="chip">Bank-feed scanner</span><span class="chip">Shield Assistant</span></div></section>
<section class="card"><div class="tabs"><button class="${mode==="in"?"on":""}" data-a="mode" data-v="in">Log in</button><button class="${mode==="up"?"on":""}" data-a="mode" data-v="up">Create account</button></div>
<label for="em">Email</label><input id="em" type="email" autocomplete="email" maxlength="254"><label for="pw">Password</label><input id="pw" type="password" autocomplete="${mode==="up"?"new-password":"current-password"}" maxlength="128">${mode==="up"?'<label for="pw2">Confirm password</label><input id="pw2" type="password" maxlength="128">':""}
<div class="err" id="er" role="alert"></div><button class="b" style="width:100%" data-a="auth">${mode==="up"?"Create account":"Log in"}</button><p class="mu" style="font-size:12px;margin:14px 0 0">Passwords are hashed with PBKDF2 before storage. Many accounts can share one device, each with private data.</p></section></div>`;return}
const N=[["dash","Dashboard"],["subs","Subscriptions"],["scan","Bank scanner"],["act","Activity"],["ai","Shield Assistant"]];
a.innerHTML=`<header><span class="logo">🛡 Shield</span><nav>${N.map(n=>`<button class="${view===n[0]?"on":""}" data-a="view" data-v="${n[0]}">${n[1]}</button>`).join("")}</nav><span class="mu" style="font-size:13px">${esc(U.split("@")[0])}</span><button class="g" data-a="out">Log out</button></header><main id="mn"></main>`;
({dash:vDash,subs:vSubs,scan:vScan,act:vAct,ai:vAi})[view]()}
function vDash(){const L=live(),z=L.filter(s=>state(s)==="zombie"),m=mo(),zl=z.reduce((a,s)=>a+s.amt,0),cats={};L.forEach(s=>cats[s.cat]=(cats[s.cat]||0)+s.amt);
let off=0;const C=2*Math.PI*52,arcs=Object.entries(cats).map(([k,v])=>{const l=v/m*C,r=`<circle r="52" cx="70" cy="70" fill="none" stroke="${COL[k]||COL.Other}" stroke-width="18" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=l;return r}).join("");
const top=[...D.subs].filter(s=>s.status==="active").sort((a,b)=>risk(b)-risk(a)).slice(0,4);
$("#mn").innerHTML=`<h2 style="margin-bottom:16px">Your subscription picture</h2><div class="grid g4"><div class="card stat v"><span class="mu">Monthly spend</span><b>${inr(m)}</b></div><div class="card stat c"><span class="mu">Projected yearly</span><b>${inr(m*12)}</b></div><div class="card stat r"><span class="mu">Zombie subscriptions</span><b>${z.length}</b></div><div class="card stat p"><span class="mu">Leaking each year</span><b>${inr(zl*12)}</b></div></div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3 style="margin-bottom:14px">Where your money goes</h3><div class="donut"><svg width="140" height="140" viewBox="0 0 140 140" role="img" aria-label="Spend by category">${arcs}<text x="70" y="68" text-anchor="middle" fill="#eef0ff" font-weight="800" font-size="15">${inr(m)}</text><text x="70" y="86" text-anchor="middle" fill="#8e93b8" font-size="10">per month</text></svg><div class="lg">${Object.entries(cats).map(([k,v])=>`<div><i style="background:${COL[k]||COL.Other}"></i>${esc(k)} · ${inr(v)}</div>`).join("")||"<span class=mu>No active subscriptions.</span>"}</div></div></div>
<div class="card"><h3 style="margin-bottom:12px">Watch list</h3>${top.map(s=>`<div style="margin-bottom:12px"><div class="row"><b>${esc(s.name)}</b><span class="sp"></span><span class="tag t-${state(s)}">${lab[state(s)]}</span></div><div class="bar"><i style="width:${risk(s)}%;background:${rc(risk(s))}"></i></div></div>`).join("")||"<span class=mu>Nothing to watch. Add a subscription to start.</span>"}</div></div>`}
function card(s){const r=risk(s),t=state(s);return`<div class="card"><div class="sub"><div class="av">${esc(s.name[0].toUpperCase())}</div><div><div class="row"><b>${esc(s.name)}</b><span class="tag t-${t}">${lab[t]}</span></div><div class="mu" style="font-size:13px">${esc(s.cat)} · ${inr(s.amt)}/mo · ${s.status==="active"?"unused "+idle(s)+" days":"mandate revoked"}</div></div><div style="text-align:right;min-width:92px"><div class="mu" style="font-size:12px">Risk ${r}</div><div class="bar"><i style="width:${r}%;background:${rc(r)}"></i></div></div>
${s.status==="active"?`<div class="acts"><label class="row" style="gap:8px">Cap ₹<input class="cap" type="number" min="1" max="100000" value="${s.cap}" data-a="cap" data-id="${s.id}" aria-label="Spending cap for ${esc(s.name)}"></label><button class="g" data-a="hike" data-id="${s.id}">Simulate price hike</button><button class="g" data-a="used" data-id="${s.id}">Mark used today</button><button class="d" data-a="kill" data-id="${s.id}">Kill Switch</button></div>`:`<div class="acts"><button class="g" data-a="del" data-id="${s.id}">Remove</button></div>`}</div></div>`}
let fl="all",q="",so="risk";
function vSubs(){$("#mn").innerHTML=`<div class="row" style="margin-bottom:14px"><h2 class="sp">Subscriptions</h2><button class="b" data-a="add">Add subscription</button></div><div class="tb"><input id="q" placeholder="Search" maxlength="40" value="${esc(q)}"><select id="fl">${["all","active","risk","zombie","cancelled"].map(x=>`<option value="${x}" ${fl===x?"selected":""}>${x==="all"?"All":lab[x]}</option>`).join("")}</select><select id="so">${[["risk","Highest risk"],["amt","Highest cost"],["name","Name"]].map(x=>`<option value="${x[0]}" ${so===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div><div class="grid" id="ls"></div>`;list()}
function list(){let a=D.subs.filter(s=>(fl==="all"||state(s)===fl)&&s.name.toLowerCase().includes(q.toLowerCase()));a.sort((x,y)=>so==="risk"?risk(y)-risk(x):so==="amt"?y.amt-x.amt:x.name.localeCompare(y.name));$("#ls").innerHTML=a.map(card).join("")||'<div class="card mu">No matches. Add a subscription or change the filter.</div>'}
function vScan(){$("#mn").innerHTML=`<div class="row" style="margin-bottom:6px"><h2 class="sp">Bank-feed scanner</h2><button class="b" data-a="scan">Scan sample feed</button></div><p class="mu">Reads a simulated bank statement and finds repeating debits you have not registered. No real bank is connected.</p><div id="sc" class="grid"></div>`}
function runScan(){const names=D.subs.map(s=>s.name.toLowerCase()),f=FEED.filter(x=>x[2]>=2&&!names.some(n=>n.includes(x[0].toLowerCase())));$("#sc").innerHTML=f.map(x=>`<div class="card row"><div><b>${esc(x[0])}</b><div class="mu" style="font-size:13px">${inr(x[1])} charged ${x[2]} months in a row, not in your Shield</div></div><span class="sp"></span><button class="b" data-a="adopt" data-n="${esc(x[0])}" data-p="${x[1]}">Add to Shield</button></div>`).join("")||'<div class="card mu">No hidden recurring payments found. Everything repeating is already protected.</div>';log("Bank-feed scan found "+f.length+" unregistered recurring debits","scan")}
function vAct(){$("#mn").innerHTML=`<h2 style="margin-bottom:14px">Activity log</h2><div class="card">${D.log.map(l=>`<div class="log"><span class="dot" style="background:${{kill:"var(--rd)",block:"var(--am)",add:"var(--gr)",scan:"var(--cy)"}[l.k]||"var(--vi)"}"></span><span>${esc(l.t)}</span><span class="mu" style="font-size:12px">${new Date(l.at).toLocaleString()}</span></div>`).join("")||'<span class="mu">Nothing yet.</span>'}</div>`}
let chat=[{r:"a",t:"Hi, I'm your Shield Assistant. Ask about unused subscriptions, monthly spend, risky services or what to cancel."}];
function vAi(){$("#mn").innerHTML=`<h2 style="margin-bottom:14px">Shield Assistant</h2><div class="card"><div class="chat" id="ch">${chat.map(c=>`<div class="m ${c.r==="u"?"u":"a"}">${esc(c.t)}</div>`).join("")}</div><div class="row"><input id="qa" style="flex:1;margin:0" maxlength="120" placeholder="Which subscriptions are unused?"><button class="b" data-a="ask">Ask</button></div><div class="chips">${["Which are unused?","How much do I spend?","What should I cancel?","Any risky ones?"].map(x=>`<button class="chip g" data-a="ask" data-q="${x}">${x}</button>`).join("")}</div></div>`;const c=$("#ch");c.scrollTop=c.scrollHeight}
function answer(t){t=t.toLowerCase();const L=live(),z=L.filter(s=>state(s)==="zombie"),r=L.filter(s=>state(s)==="risk"),n=a=>a.map(s=>s.name+" ("+inr(s.amt)+", idle "+idle(s)+"d)").join("\n");
if(/unused|zombie|idle|forgot/.test(t))return z.length?"Zombie subscriptions (30+ days unused):\n"+n(z):"No zombies right now. Nice.";
if(/cancel|kill|stop/.test(t)){const x=[...z,...r].sort((a,b)=>b.amt-a.amt);return x.length?"I'd cancel first:\n"+n(x.slice(0,3))+"\nUse the Kill Switch on the Subscriptions tab.":"Nothing needs cancelling."}
if(/risk|danger|warn/.test(t))return r.length?"Trending toward zombie:\n"+n(r):"No services are at risk yet.";
if(/year|annual/.test(t))return"You are on track to spend "+inr(mo()*12)+" this year.";
if(/spend|month|cost|total|pay/.test(t))return"You spend "+inr(mo())+" per month across "+L.length+" active subscriptions. Zombies cost "+inr(z.reduce((a,s)=>a+s.amt,0))+" of that.";
if(/cap|limit|price/.test(t))return"Set a cap on any subscription card. If a vendor raises the price above it, the charge is blocked. Try 'Simulate price hike'.";
return"I can answer questions about unused subscriptions, monthly or yearly spend, risky services and what to cancel."}
function addForm(){modal(`<h3 style="margin-bottom:12px">Add subscription</h3><label for="an">Name</label><input id="an" maxlength="40"><label for="ac">Category</label><select id="ac">${Object.keys(COL).map(k=>`<option>${k}</option>`).join("")}</select><label for="aa">Monthly amount (₹)</label><input id="aa" type="number" min="1" max="100000"><label for="ad">Days since last used</label><input id="ad" type="number" min="0" max="365" value="0"><label for="au">Cancellation link (optional, https)</label><input id="au" maxlength="200"><div class="err" id="ae"></div><div class="row"><button class="g" data-a="close">Cancel</button><span class="sp"></span><button class="b" data-a="save">Add to Shield</button></div>`)}
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id;
if(U&&!["close","mode"].includes(a)){if(!ok("act",30,1e4)){toast("Slow down. Too many actions at once.","bad");return}touch()}
const s=D&&D.subs.find(x=>x.id===id);
if(a==="mode"){mode=t.dataset.v;render()}else if(a==="auth")auth();else if(a==="out")logout();else if(a==="view"){view=t.dataset.v;render()}
else if(a==="add")addForm();else if(a==="close")closeM();
else if(a==="save"){const n=$("#an").value.trim(),p=+$("#aa").value,d=+$("#ad").value,u=$("#au").value.trim();if(!n||n.length>40||!(p>=1&&p<=1e5)||!(d>=0&&d<=365)){$("#ae").textContent="Enter a name, an amount of ₹1 to ₹1,00,000 and 0 to 365 idle days.";return}if(u&&!/^https:\/\/[^\s]+$/.test(u)){$("#ae").textContent="Cancellation link must start with https://";return}if(D.subs.length>=60){$("#ae").textContent="Limit of 60 subscriptions reached.";return}D.subs.push(mk(n,$("#ac").value,Math.round(p),d,u));log("Added "+n+" at "+inr(p)+"/mo","add");closeM();toast(n+" is now protected.","good");render()}
else if(a==="kill"&&s){modal(`<h3>Kill ${esc(s.name)}?</h3><p class="mu">This revokes the payment mandate right now and opens the vendor's cancellation page. No retention screens.</p><div class="row"><button class="g" data-a="close">Keep it</button><span class="sp"></span><button class="d" data-a="kill2" data-id="${s.id}">Revoke mandate</button></div>`)}
else if(a==="kill2"&&s){s.status="cancelled";log("Kill Switch: revoked mandate for "+s.name+" ("+inr(s.amt)+"/mo saved)","kill");closeM();toast("Mandate revoked for "+s.name+". You save "+inr(s.amt*12)+" a year.","good");if(s.url){try{window.open(s.url,"_blank","noopener,noreferrer")}catch(x){}}render()}
else if(a==="hike"&&s){const n=Math.round(s.amt*1.2);if(n>s.cap){log("Blocked "+s.name+" price hike to "+inr(n)+" (cap "+inr(s.cap)+")","block");toast(s.name+" tried "+inr(n)+". Blocked by your "+inr(s.cap)+" cap.","bad")}else{s.amt=n;log(s.name+" raised price to "+inr(n)+", within cap","info");toast(s.name+" price rose to "+inr(n)+" (within your cap).")}sv("gss_d_"+U,D);render()}
else if(a==="used"&&s){s.last=Date.now();log("Marked "+s.name+" as used","info");render()}
else if(a==="del"&&s){D.subs=D.subs.filter(x=>x.id!==id);sv("gss_d_"+U,D);render()}
else if(a==="scan")runScan();
else if(a==="adopt"){const n=t.dataset.n,p=+t.dataset.p;D.subs.push(mk(n,"Other",p,0,""));log("Scanner added "+n,"add");toast(n+" added to your Shield.","good");render();view="scan";render();runScan()}
else if(a==="ask"){const q=t.dataset.q||$("#qa").value.trim().slice(0,120);if(!q)return;chat.push({r:"u",t:q},{r:"a",t:answer(q)});chat=chat.slice(-30);vAi()}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.a==="cap"){const s=D.subs.find(x=>x.id===t.dataset.id),v=Math.round(+t.value);if(s&&v>=1&&v<=1e5){s.cap=v;log("Cap for "+s.name+" set to "+inr(v),"info");toast("Cap saved: "+inr(v)+".","good")}else toast("Enter a cap between ₹1 and ₹1,00,000.","bad");render()}else if(t.id==="fl"){fl=t.value;list()}else if(t.id==="so"){so=t.value;list()}});
document.addEventListener("input",e=>{if(e.target.id==="q"){q=e.target.value.slice(0,40);list()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"){if(!U&&e.target.tagName==="INPUT")auth();else if(e.target.id==="qa")document.querySelector('[data-a="ask"]').click()}if(e.key==="Escape")closeM()});
boot();
